services:
  - type: web
    name: poster-api
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    initialDeployHook: npm run seed --workspace @poster/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://poster-press.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  - type: web
    name: poster-press
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build --workspace @poster/web
    startCommand: npm run start --workspace @poster/web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: API_ORIGIN
        value: https://poster-api.onrender.com
